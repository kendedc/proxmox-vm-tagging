---
- name: Create a working directory for the downloaded csv
  ansible.builtin.tempfile:
    state: directory
    suffix: pxt
  register: pxt_workdir
  when: pxt_source_url | length > 0
  changed_when: false

- name: Download the source table
  ansible.builtin.get_url:
    url: "{{ pxt_source_url }}"
    dest: "{{ pxt_workdir.path }}/{{ pxt_source_url | urlsplit('path') | basename }}"
    mode: "0600"
    validate_certs: "{{ pxt_validate_certs }}"
  register: pxt_download
  when: pxt_source_url | length > 0

- name: Resolve the source path
  ansible.builtin.set_fact:
    pxt_source_file: >-
      {{ pxt_download.dest if (pxt_source_url | length > 0) else pxt_source_path }}

- name: Confirm the source csv exists
  ansible.builtin.stat:
    path: "{{ pxt_source_file }}"
  register: pxt_source_stat

- name: Fail when the source csv is missing
  ansible.builtin.fail:
    msg: >-
      metadata source csv not found at {{ pxt_source_file }}. Put your export
      there (see files/vm_tags.example.csv for the expected columns), or point
      pxt_source_path / pxt_source_url somewhere else.
  when: not pxt_source_stat.stat.exists

- name: Read the source csv
  ansible.builtin.set_fact:
    pxt_rows: >-
      {{ lookup('read_csv', pxt_source_file,
                header_row=pxt_source_header_row,
                header_marker=pxt_vmid_column,
                delimiter=pxt_source_delimiter,
                encoding=pxt_source_encoding,
                wantlist=True) }}

- name: Fail when the source table is empty
  ansible.builtin.fail:
    msg: "{{ pxt_source_file }} contains no data rows"
  when: pxt_rows | length == 0

- name: Confirm the mapped columns are present
  ansible.builtin.assert:
    that:
      - pxt_vmid_column in pxt_rows[0] or pxt_name_column in pxt_rows[0]
      - pxt_metadata_columns.keys() | difference(pxt_rows[0].keys() | list)
        | length == 0
    fail_msg: >-
      the source has headers {{ pxt_rows[0].keys() | reject('match', '^_')
      | list }} but pxt_metadata_columns expects
      {{ pxt_metadata_columns.keys() | difference(pxt_rows[0].keys() | list) }};
      align pxt_metadata_columns with the headers above (header row was
      detected with pxt_source_header_row={{ pxt_source_header_row }})
    quiet: true

- name: Report the source size
  ansible.builtin.debug:
    msg: "loaded {{ pxt_rows | length }} rows from {{ pxt_source_file }}"

- name: Remove the downloaded table
  ansible.builtin.file:
    path: "{{ pxt_workdir.path }}"
    state: absent
  when: pxt_source_url | length > 0
  changed_when: false
