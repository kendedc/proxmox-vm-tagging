---
- name: Create a working directory for the downloaded workbook
  ansible.builtin.tempfile:
    state: directory
    suffix: pxt
  register: pxt_workdir
  when: pxt_source_url | length > 0
  changed_when: false

- name: Download the source table
  ansible.builtin.get_url:
    url: "{{ pxt_source_url }}"
    dest: "{{ pxt_workdir.path }}/{{ pxt_source_url | urlsplit('path') | basename }}"
    mode: "0600"
    validate_certs: "{{ pxt_validate_certs }}"
  register: pxt_download
  when: pxt_source_url | length > 0

- name: Resolve the source path
  ansible.builtin.set_fact:
    pxt_workbook: >-
      {{ pxt_download.dest if (pxt_source_url | length > 0) else pxt_source_path }}

- name: Confirm the source table exists
  ansible.builtin.stat:
    path: "{{ pxt_workbook }}"
  register: pxt_workbook_stat

- name: Fail when the source table is missing
  ansible.builtin.fail:
    msg: >-
      tag source table not found at {{ pxt_workbook }}. Commit your export
      there (see files/vm_tags.example.csv for the expected columns), or point
      pxt_source_path / pxt_source_url somewhere else.
  when: not pxt_workbook_stat.stat.exists

- name: Read the source table
  ansible.builtin.set_fact:
    pxt_rows: >-
      {{ lookup('read_table', pxt_workbook,
                format=pxt_source_format,
                sheet=pxt_source_sheet,
                header_row=pxt_source_header_row,
                encoding=pxt_source_encoding,
                wantlist=True) }}

- name: Fail when the source table is empty
  ansible.builtin.fail:
    msg: "{{ pxt_workbook }} contains no data rows"
  when: pxt_rows | length == 0

- name: Confirm the mapped columns are present
  ansible.builtin.assert:
    that:
      - pxt_vmid_column in pxt_rows[0] or pxt_name_column in pxt_rows[0]
      - (pxt_tag_columns.keys() | list + [pxt_tags_column])
        | difference(pxt_rows[0].keys() | list) | length == 0
    fail_msg: >-
      spreadsheet headers {{ pxt_rows[0].keys() | list }} do not cover the
      configured columns; check pxt_vmid_column, pxt_tags_column and
      pxt_tag_columns
    quiet: true

- name: Report the source size
  ansible.builtin.debug:
    msg: "loaded {{ pxt_rows | length }} rows from {{ pxt_workbook }}"

- name: Remove the downloaded table
  ansible.builtin.file:
    path: "{{ pxt_workdir.path }}"
    state: absent
  when: pxt_source_url | length > 0
  changed_when: false
