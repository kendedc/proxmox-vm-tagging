---
- name: Match spreadsheet rows to live guests
  ansible.builtin.set_fact:
    pxt_resolved: >-
      {{ pxt_rows | resolve_targets(pxt_current,
                                    vmid_column=pxt_vmid_column,
                                    name_column=pxt_name_column,
                                    metadata_columns=pxt_metadata_columns,
                                    preserve_unmanaged=pxt_preserve_unmanaged,
                                    write_empty=pxt_write_empty) }}

- name: Fail on malformed spreadsheet rows
  ansible.builtin.fail:
    msg: >-
      {{ pxt_resolved.invalid_rows | length }} spreadsheet rows are unusable:
      {{ pxt_resolved.invalid_rows }}
  when: pxt_resolved.invalid_rows | length > 0

# Notes are not in /cluster/resources, so each managed guest needs its own
# config read; only guests present in the spreadsheet are fetched
- name: Read the current notes for each managed guest
  ansible.builtin.uri:
    url: >-
      {{ pxt_api_url }}/api2/json/nodes/{{ item.node }}/{{ item.type }}/{{ item.vmid }}/config
    method: GET
    headers:
      Authorization: "PVEAPIToken={{ pxt_api_token_id }}={{ pxt_api_token_secret }}"
    validate_certs: "{{ pxt_validate_certs }}"
    status_code: [200]
    timeout: 30
  loop: "{{ pxt_resolved.targets }}"
  loop_control:
    label: "{{ item.vmid }} ({{ item.name }})"
  throttle: "{{ pxt_throttle | int }}"
  register: pxt_configs
  no_log: true
  check_mode: false

- name: Diff the spreadsheet against the current notes
  ansible.builtin.set_fact:
    pxt_plan: >-
      {{ pxt_resolved | notes_plan(pxt_configs.results,
                                   metadata_columns=pxt_metadata_columns,
                                   preserve_unmanaged=pxt_preserve_unmanaged,
                                   write_empty=pxt_write_empty) }}

- name: Show the plan summary
  ansible.builtin.debug:
    var: pxt_plan.stats

- name: Show each pending change
  ansible.builtin.debug:
    msg: >-
      {{ item.vmid }} ({{ item.name }} on {{ item.node }}) row {{ item.row }}:
      {{ item.managed_keys | join(', ') if item.managed_keys else 'no metadata in sheet' }}
      {{ '(+%d preserved lines)' % (item.preserved_lines | length)
         if item.preserved_lines else '' }}
  loop: "{{ pxt_plan.changes }}"
  loop_control:
    label: "{{ item.vmid }}"

- name: Warn about rows that matched no guest
  ansible.builtin.debug:
    msg: >-
      row {{ item.row }} references {{ item.identifier }}, which does not exist
      in Proxmox
  loop: "{{ pxt_plan.missing_in_proxmox }}"
  loop_control:
    label: "{{ item.identifier }}"

- name: Enforce the change-volume safety rails
  ansible.builtin.assert:
    that:
      - pxt_plan.stats.changed <= (pxt_max_changes | int)
      - pxt_plan.stats.changed_pct <= (pxt_max_changed_pct | float)
    fail_msg: >-
      plan would rewrite notes on {{ pxt_plan.stats.changed }} guests
      ({{ pxt_plan.stats.changed_pct }}% of the cluster), above the limits
      pxt_max_changes={{ pxt_max_changes }} /
      pxt_max_changed_pct={{ pxt_max_changed_pct }}. Review the report, then
      raise the limits deliberately if the change really is this large.
    quiet: true
