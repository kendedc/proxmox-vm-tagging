---
# Proxmox API endpoint, e.g. https://pve01.example.com:8006
pxt_api_url: "https://proxmox.example.com:8006"
pxt_validate_certs: true

# API token credentials — inject these from AWX, never commit them
# Format: pxt_api_token_id = "ansible@pve!tagging"
pxt_api_token_id: ""
pxt_api_token_secret: ""

# Source table: a path inside the project, or a URL to download first
# csv needs no extra dependency; xlsx additionally needs openpyxl in the EE
pxt_source_path: "{{ playbook_dir }}/files/vm_tags.csv"
pxt_source_url: ""
pxt_source_format: "auto"

# 'auto' finds the header row by looking for the VMID column, so title and
# spacer rows above the table do not matter; pin a number to override
pxt_source_header_row: "auto"

# utf-8-sig transparently strips the BOM that Excel's "CSV UTF-8" export adds
pxt_source_encoding: "utf-8-sig"

# xlsx only — ignored for csv
pxt_source_sheet: "VMs"

# Match key columns
pxt_vmid_column: "VMID"
pxt_name_column: "Name"

# Sheet header -> key written into the guest notes, in the order they appear
# Columns not listed here (Host, Type, IP Address, Status, OS, CPU, Memory,
# Disk) are facts read from Proxmox, not metadata, so they are never written
pxt_metadata_columns:
  Owner: "Owner"
  Environment: "Environment"
  Application: "Application"
  Site: "Site"
  Internet Facing: "InternetFacing"
  Criticality: "Criticality"
  Business Service: "BusinessService"
  Contact Group: "ContactGroup"
  BackupRequired: "BackupRequired"
  SupportVendor: "SupportVendor"

# Keep any existing notes lines that are not managed Key=Value pairs
# Set false to make the spreadsheet strictly authoritative over the whole field
pxt_preserve_unmanaged: true

# Write rows whose metadata columns are all blank, clearing the managed keys
pxt_write_empty: true

# Guest types to manage: qemu, lxc, or both
pxt_guest_types:
  - qemu
  - lxc

# Safety rails — the run aborts before writing if either is exceeded
pxt_max_changes: 100
pxt_max_changed_pct: 40

# Set false to plan and report without writing anything
pxt_apply: true

# Concurrent API calls; Proxmox is happy at 5-10
pxt_throttle: 5

# Where the run report is written on the controller
pxt_report_dir: "{{ playbook_dir }}/reports"
pxt_report_enabled: true
