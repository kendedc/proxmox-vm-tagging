---
# Read-only sanity check: parses the spreadsheet and prints the plan, never writes
# Point an AWX job template at this for the "what would change?" workflow
- name: Validate the metadata spreadsheet against Proxmox
  hosts: localhost
  connection: local
  gather_facts: true
  become: false

  vars:
    pxt_apply: false

  roles:
    - role: proxmox_tagging
