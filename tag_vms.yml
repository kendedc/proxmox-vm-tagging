---
# Reconcile Proxmox guest notes from the Excel source of truth
# Everything runs against the Proxmox API from the controller — no SSH to guests
- name: Reconcile Proxmox VM metadata
  hosts: localhost
  connection: local
  gather_facts: true
  become: false

  vars:
    # This is the write playbook, so opt out of the safe default
    # Still overridable with -e pxt_dry_run=true to preview
    pxt_dry_run: false

  roles:
    - role: proxmox_tagging
