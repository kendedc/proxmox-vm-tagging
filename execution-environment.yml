---
# ONLY needed if the tag source stays as .xlsx — on the CSV path the stock
# awx-ee image runs this project unchanged and you can ignore this file
#
# Build with: ansible-builder build -t proxmox-tagging-ee:1.0.0 -f execution-environment.yml
# Then push to your registry and register it in AWX under Execution Environments
version: 3

images:
  base_image:
    name: quay.io/ansible/awx-ee:latest

dependencies:
  galaxy: collections/requirements.yml
  python: requirements.txt
  system: []

additional_build_steps:
  append_final:
    - RUN pip3 check
