[defaults]
inventory = inventory/localhost.yml
roles_path = roles
host_key_checking = True
stdout_callback = default
result_format = yaml
display_skipped_hosts = False
retry_files_enabled = False
interpreter_python = auto_silent

# Plugin paths are deliberately absent: the lookup and filter live in
# roles/proxmox_tagging/{lookup,filter}_plugins and are auto-loaded with the
# role, so the playbook works under AWX where this file is not authoritative

[inventory]
unparsed_is_failed = True
