---
# Site configuration — override per environment or via an AWX survey
# Secrets belong in an AWX credential, never here
pxt_api_url: "https://pve01.example.com:8006"
pxt_validate_certs: true

pxt_source_path: "{{ playbook_dir }}/files/vm_tags.csv"
pxt_source_header_row: "auto"

pxt_vmid_column: "VMID"
pxt_name_column: "Name"

# Left-hand side must match the spreadsheet headers exactly; the run fails and
# prints the headers it actually found if any of these are missing
pxt_metadata_columns:
  Owner: "Owner"
  Environment: "Environment"
  Application: "Application"
  Site: "Site"
  Internet Facing: "InternetFacing"
  Criticality: "Criticality"
  Business Service: "BusinessService"
  Contact Group: "ContactGroup"
  BackupRequired: "BackupRequired"
  SupportVendor: "SupportVendor"

pxt_preserve_unmanaged: true
pxt_write_empty: true

pxt_max_changes: 100
pxt_max_changed_pct: 40
